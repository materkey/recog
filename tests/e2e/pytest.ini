# The e2e suite's own configuration: `pytest tests/e2e` finds this file first, so
# its rootdir is tests/e2e and tests/conftest.py, which imports recog, is not
# loaded. The suite drives the Rust live process and needs only its test tools.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    e2e: end-to-end tests requiring KTalk, browser, and audio hardware
    needs_audio_loopback: e2e test that requires system audio output to be routed through Multi-Output Device (BlackHole) so mixed-path capture can record browser audio. Only such tests trigger the output-switching in conftest — other tests leave the user's speakers alone.
