<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recog - Transcripts</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/datepicker.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="nav">
            <a href="#/" class="nav-brand">Recog</a>
            <div class="nav-links">
                <a href="#/" class="nav-link" data-route="meetings">Meetings</a>
                <a href="#/live" class="nav-link" data-route="live">Live</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main">
            <!-- Meetings List View -->
            <div id="view-meetings" class="view">
                <div class="view-header">
                    <h1>Meetings</h1>
                    <div class="filters">
                        <div class="date-nav">
                            <button id="date-prev" class="date-nav-btn" title="Previous day">←</button>
                            <input type="date" id="filter-date" class="filter-date">
                            <button id="date-next" class="date-nav-btn" title="Next day">→</button>
                            <button id="date-today" class="date-nav-btn date-today-btn" title="Today">Today</button>
                        </div>
                        <div class="search-box">
                            <input type="text" id="filter-title" placeholder="Search..." class="search-input filter-title-input">
                            <select id="search-mode" class="search-mode-select">
                                <option value="title">by title</option>
                                <option value="content">by content</option>
                            </select>
                        </div>
                        <select id="filter-source" class="filter-select">
                            <option value="">All sources</option>
                            <option value="active">Active (LIVE)</option>
                            <option value="ktalk">KTalk</option>
                            <option value="ktalk-export">KTalk Export</option>
                            <option value="matrix">Matrix</option>
                            <option value="limitless">Limitless</option>
                            <option value="local">Local</option>
                            <option value="orphan">Orphan</option>
                            <option value="diarized">Diarized</option>
                        </select>
                    </div>
                </div>
                <div id="meetings-list" class="meetings-list">
                    <div class="loading">Loading meetings...</div>
                </div>
                <div id="search-results" class="search-results" style="display: none;"></div>
            </div>

            <!-- Meeting Detail View -->
            <div id="view-meeting" class="view" style="display: none;">
                <div class="view-header">
                    <button class="btn-back" onclick="router.navigate('/')">&larr; Back</button>
                    <h1 id="meeting-title">Meeting</h1>
                    <div class="meeting-actions">
                        <button class="btn" onclick="copyToClipboard()">Copy</button>
                        <button class="btn" onclick="exportMarkdown()">Export MD</button>
                        <button class="btn btn-privacy" id="privacy-mode-btn" onclick="togglePrivacy()" title="Replace names with speaker_N in Copy/Export">Privacy</button>
                        <button class="btn btn-ai" onclick="analyzeIncrement()">AI Analysis</button>
                        <button class="btn btn-danger" id="delete-meeting-btn" onclick="deleteMeeting()">Delete</button>
                    </div>
                </div>
                <div class="meeting-meta" id="meeting-meta"></div>
                <div class="transcript-search">
                    <input type="text" id="transcript-search" placeholder="Search in transcript..." class="search-input">
                </div>
                <div id="transcript" class="transcript"></div>
            </div>

            <!-- Live View -->
            <div id="view-live" class="view" style="display: none;">
                <div class="view-header">
                    <h1>Live Transcription</h1>
                    <button class="btn btn-anchor" id="anchor-btn" onclick="openAnchor()" title="Alt+J">Context</button>
                    <button class="btn btn-follow active" id="follow-btn" onclick="toggleFollowMode()" title="Auto-scroll to new messages">Follow</button>
                    <button class="btn" id="copy-live-btn" onclick="copyLiveToClipboard()" title="Copy transcript as Markdown">Copy MD</button>
                    <button class="btn" id="download-live-btn" onclick="downloadLiveMarkdown()" title="Download transcript as Markdown file">↓ MD</button>
                    <button class="btn btn-privacy" id="live-privacy-btn" onclick="togglePrivacy()" title="Replace names with speaker_N in Copy/Download">Privacy</button>
                    <div class="live-status" id="live-status">
                        <span class="status-dot"></span>
                        <span class="status-text">Connecting...</span>
                    </div>
                </div>
                <div class="live-meeting-info" id="live-meeting-info"></div>
                <div id="live-transcript" class="transcript live-transcript"></div>
            </div>
        </main>
    </div>

    <!-- AI Analysis Modal -->
    <div id="ai-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>AI Analysis</h3>
                <button class="modal-close" onclick="closeAiModal()">&times;</button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" data-provider="claude" onclick="switchAiTab('claude')">Claude</button>
                <button class="tab-btn" data-provider="codex" onclick="switchAiTab('codex')">Codex</button>
            </div>
            <div class="modal-body">
                <div id="ai-response-claude" class="ai-tab-content active">
                    <div class="loading">Analyzing with Claude...</div>
                </div>
                <div id="ai-response-codex" class="ai-tab-content">
                    <div class="loading">Analyzing with Codex...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="copyAiResponse()">Copy</button>
                <button class="btn" onclick="closeAiModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Anchor / WDIM Overlay -->
    <div id="anchor-overlay" class="anchor-overlay" style="display: none;">
        <div class="anchor-card" role="dialog" aria-modal="true" aria-labelledby="anchor-title">
            <div class="anchor-header">
                <div class="anchor-title" id="anchor-title">Right now</div>
                <button class="anchor-close" onclick="closeAnchor()">&times;</button>
            </div>
            <div class="anchor-topic">
                <span class="anchor-tone tone-neutral" id="anchor-tone">neutral</span>
                <div class="anchor-topic-text" id="anchor-topic-text">Loading...</div>
            </div>
            <div class="anchor-section">
                <div class="anchor-section-title">Last minutes</div>
                <ul id="anchor-bullets" class="anchor-bullets"></ul>
            </div>
            <div class="anchor-footer">
                <div id="anchor-mention" class="anchor-mention"></div>
                <div id="anchor-note" class="anchor-note"></div>
            </div>
        </div>
    </div>

    <script src="/static/datepicker.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
