# recog installation settings: ~/.config/recog/config.toml
# (docs/configuration.md). Not secrets: those stay in .env. Each setting is the
# default for the environment variable named beside it; the process
# environment and .env override it. Unknown tables or keys are errors.

[conferences]
# Jitsi and Element Call servers beyond the built-in hosts
# (docs/conference-hosts.md); rebuild the extension after a change.
# jitsi = ["https://meet.example.org"]
# matrix = ["https://element.example.org"]

[sources.aliases]
# Nonstandard source names of old recordings -> jitsi or matrix.
# old-meet = "jitsi"

[sources.labels]
# Web UI names of the sources your own importers write.
# phone = "Phone"

[asr]
# RECOG_ASR_BACKEND: "auto" (default) or "wavo", GigaAM on the Rust runtime wavo
# inside the live process, or "remote", which offloads it to an
# OpenAI-Whisper-compatible gateway (ADR-0020) with wavo as the lazy local
# fallback and a circuit breaker (enable only on a confirmed LAN). "local" (the
# PyTorch model) is gone: it runs on wavo, and the log says so.
# backend = "auto"
# RECOG_ASR_REMOTE_URL: gateway base URL. No default: backend = "remote"
# without it fails at startup instead of silently running on-device.
# remote_url = "https://<asr-gateway>/asr"
# RECOG_ASR_REMOTE_MODEL: model alias the gateway uses (GET /v1/models).
# remote_model = "gigaam"
# RECOG_ASR_REMOTE_TIMEOUT_S: per-request timeout for refine/offline calls.
# remote_timeout_s = 15
# RECOG_ASR_LIVE_TIMEOUT_S: shorter timeout for live chunk/batch calls, so a
# 3 s chunk never blocks the pipeline for long while the gateway is down.
# live_timeout_s = 5
# RECOG_ASR_CIRCUIT_FAILS: remote failures within 60 s before the circuit
# opens and routes straight to the local fallback.
# circuit_fails = 3
# RECOG_ASR_CIRCUIT_OPEN_S: seconds open before one half-open remote probe.
# circuit_open_s = 60
# ASR_PENDING_BUFFER_CAP_S: audio kept in memory while no ASR can serve
# (remote down, local model still loading); the oldest is dropped beyond it.
# pending_buffer_cap_s = 600
# RECOG_ASR_DEVICE: auto (cuda > mps > cpu), cuda, mps or cpu. An explicit
# device that is unavailable fails fast instead of landing on CPU.
# device = "auto"
# RECOG_TORCH_THREADS: torch.set_num_threads() cap for CPU inference; live and
# refine share one model lock and otherwise take every core.
# torch_threads = 4

[live]
# DEDUP_MAX_GAP_S: last-words dedup applies only within this many seconds of
# the previous segment; beyond it a repeated phrase is real speech.
# dedup_max_gap_s = 2.0
# RECOG_PULSE_MONITOR_SOURCE (Linux): pin the PulseAudio/PipeWire monitor;
# unset, the capture follows the default sink (`pactl list short sources`).
# pulse_monitor_source = "alsa_output.pci-0000_00_1f.3.analog-stereo.monitor"
# RECOG_ZOOM_APP (macOS): speaker detection for the native Zoom application
# (docs/zoom-app.md).
# zoom_app = false
# RECOG_ECHO_CANCEL (macOS): cancel what the built-in speakers play out of the
# microphone, so it does not reach the transcript under your name. Needs
# `--system-audio screencapture`, which `auto` is on macOS. Stays off by default
# until it has been checked on real calls and headphones.
# echo_cancel = false
# RECOG_MIC_WORKER: no effect, the microphone is always captured by bin/recog-mic
# (macOS); still accepted from older configurations.
# mic_worker = "rust"
# RECOG_LIVE_RUNTIME: no effect, the live service is always bin/recog; still
# accepted from older configurations.
# runtime = "rust"
# RECOG_GOLDEN_RECORD: record each live session (bridge frames; microphone and
# system audio and ASR answers while a conference is on) under <data dir>/golden,
# to replay it into a new implementation
# (docs/plans/2026-11-07-golden-sessions-design.md). It holds your and the other
# participants' audio and words, 0.5-1 GB an hour of meeting. A session older than
# 14 days is deleted when the next one starts, unless its directory is renamed to
# end with "-keep".
# golden_record = false

[copilot]
# RECOG_COPILOT_AUTOSPAWN: spawn a Claude copilot session per conference
# meeting; manual spawn from the web UI works either way.
# autospawn = true
# RECOG_COPILOT_GRACE_S: seconds before the session is killed after
# meeting_ended; a same-id rejoin within it keeps the session.
# grace_s = 90
# RECOG_COPILOT_MCP_URL: the copilot_channel MCP daemon the session uses.
# mcp_url = "http://127.0.0.1:8767/mcp"
# RECOG_COPILOT_RUNTIME: no effect, the supervisor and the channel are always
# bin/recog-copilot-*; still accepted from older configurations.
# runtime = "rust"

[web]
# EXTERNAL_MEETINGS_PATHS: read-only meeting directories of other sources,
# each "path" or "path:source".
# external_meetings_paths = ["/path/to/ktalk-export/meetings", "/path/to/other/meetings:other"]
# RECOG_EXTRA_WS_ORIGINS: extra exact origins allowed to open the bridge and
# live-stream WebSockets, for backend-only integrations.
# extra_ws_origins = ["https://meet.example.com"]
# RECOG_BRIDGE_WS_URL: bridge WebSocket the web server subscribes to.
# bridge_ws_url = "ws://localhost:8766"
# RECOG_WEB_RUNTIME: no effect, the web server is always bin/recog-web (which
# also runs the KTalk desktop integration's observer, docs/desktop-ktalk.md);
# still accepted from older configurations.
# runtime = "rust"

[macos]
# RECOG_CODESIGN_IDENTITY: signing identity for RecogZoomHelper.app (default
# ad hoc); with a real identity the Accessibility grant survives a rebuild.
# codesign_identity = "Developer ID Application: ..."

[install]
# RECOG_INSTALL_RUNTIME: "rust", the only installation: ./setup.sh builds the
# programs of crates/ with cargo into bin/ and the units run them. "python" is
# gone and makes setup.sh stop. setup.sh and recog-service.sh read this key
# from this file or the calling shell, never from .env.
# runtime = "rust"
