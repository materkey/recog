name: recog
arch: amd64
platform: linux
version: ${RECOG_VERSION}
release: "1"
maintainer: materkey <materkey@users.noreply.github.com>
description: Russian meeting transcription with speaker names
homepage: https://recog.vkkovalev.work/
license: MIT
section: sound
priority: optional
contents:
  - src: recog/
    dst: /usr/lib/recog
    type: tree
  - src: /usr/lib/recog/bin/recog
    dst: /usr/bin/recog
    type: symlink
  - src: recog-setup
    dst: /usr/bin/recog-setup
    file_info:
      mode: 0755
  - src: recog-setup.desktop
    dst: /usr/share/applications/recog-setup.desktop
  - src: recog.desktop
    dst: /usr/share/applications/recog.desktop
  - src: recog.svg
    dst: /usr/share/icons/hicolor/scalable/apps/recog.svg
  - src: recog-upgrade.path
    dst: /usr/lib/systemd/user/recog-upgrade.path
  - src: recog-upgrade.service
    dst: /usr/lib/systemd/user/recog-upgrade.service
  # Tells recog update which package manager owns the release.
  - src: recog-package.apt
    dst: /usr/lib/recog/recog-package
    packager: deb
  - src: recog-package.pacman
    dst: /usr/lib/recog/recog-package
    packager: archlinux
  - src: recog/LICENSE
    dst: /usr/share/licenses/recog/LICENSE
scripts:
  postinstall: postinstall.sh
  postremove: postremove.sh
archlinux:
  packager: materkey <materkey@users.noreply.github.com>
  scripts:
    postupgrade: postinstall.sh
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - ffmpeg
      - pulseaudio-utils
      - pipewire-audio | pulseaudio
      - libvulkan1
      - mesa-vulkan-drivers | vulkan-icd
      - systemd
      - dbus-user-session
      - xdg-utils
  archlinux:
    depends:
      - glibc>=2.39
      - ffmpeg
      - libpulse
      - pulse-native-provider
      - vulkan-icd-loader
      - vulkan-swrast
      - systemd
      - xdg-utils
