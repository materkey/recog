<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTalk Speaker Detector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
    }

    .header {
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      text-align: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .header p {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .status {
      padding: 10px 15px;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
    }

    .status-dot.connected {
      background: #44ff44;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .section {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.5;
      margin-bottom: 10px;
    }

    .current-speaker {
      background: rgba(102, 126, 234, 0.2);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .current-speaker .icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .current-speaker .name {
      font-size: 18px;
      font-weight: 600;
    }

    .current-speaker .id {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 4px;
      font-family: monospace;
    }

    .participants-list, .history-list {
      list-style: none;
    }

    .participants-list li, .history-list li {
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .participants-list li:last-child, .history-list li:last-child {
      margin-bottom: 0;
    }

    .participant-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .participant-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
    }

    .participant-local {
      font-size: 10px;
      background: rgba(102, 126, 234, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .history-time {
      font-size: 11px;
      opacity: 0.5;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      opacity: 0.5;
      font-size: 13px;
    }

    .footer {
      padding: 10px 15px;
      text-align: center;
      font-size: 10px;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>KTalk Speaker Detector</h1>
    <p>Real-time active speaker detection</p>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Checking connection...</span>
  </div>

  <div class="section">
    <div class="section-title">Current Speaker</div>
    <div class="current-speaker">
      <div class="icon">🎤</div>
      <div class="name" id="currentSpeakerName">-</div>
      <div class="id" id="currentSpeakerId"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Participants (<span id="participantCount">0</span>)</div>
    <ul class="participants-list" id="participantsList">
      <li class="empty-state">No participants</li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">Recent Speakers</div>
    <ul class="history-list" id="historyList">
      <li class="empty-state">No history yet</li>
    </ul>
  </div>

  <div class="footer">
    KTalk Speaker Detector v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
