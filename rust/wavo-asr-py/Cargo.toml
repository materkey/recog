[package]
name = "wavo-asr-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Python module running GigaAM v3 e2e_rnnt on wavo, for recog's ASR backend \"wavo\""
publish = false

[lib]
name = "wavo_asr"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
# Pinned exactly: a month-old crate with one maintainer. Repeat the measurements of
# docs/experiments/2026-11-07-rust-asr-runtimes.md before moving it.
wavo = { version = "=0.4.0", default-features = false, features = ["hub"] }
