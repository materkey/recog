[package]
name = "recog-core"
version = "0.1.0"
edition = "2024"
description = "The installation settings, data directory, user profile and meeting storage of recog"
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
# TOML 1.0, the version Python's tomllib reads (toml 0.9 and later read TOML 1.1, which
# accepts documents tomllib refuses).
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
uuid = { version = "1.20", features = ["v4"] }

[dev-dependencies]
base64 = "0.22.1"
serde_json = "1.0.141"
tempfile = "3.20"
