# The Rust code of recog (docs/plans/2026-11-07-rust-migration.md). Build and test from
# this directory; speexdsp-aec/README.md says which tests need its golden data. The
# Python modules are built by pip from speexdsp-aec-py and wavo-asr-py (maturin):
# see setup.sh.
[workspace]
resolver = "3"
members = ["recog-ai", "recog-bridge", "recog-copilot", "recog-core", "recog-live", "recog-mic", "recog-zoom", "speexdsp-aec", "speexdsp-aec-py", "wavo-asr-py"]

[profile.release]
lto = "fat"
codegen-units = 1

# The parity tests replay minutes of audio: optimise them, keep overflow checks (a
# plain `+` that C would wrap panics there instead of silently diverging).
[profile.test]
opt-level = 3
