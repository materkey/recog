# The Rust code of recog (docs/plans/2026-11-07-rust-migration.md). Build and test from
# this directory; speexdsp-aec/README.md says which tests need its golden data.
[workspace]
resolver = "3"
members = ["speexdsp-aec"]

[profile.release]
lto = "fat"
codegen-units = 1

# The parity tests replay minutes of audio: optimise them, keep overflow checks (a
# plain `+` that C would wrap panics there instead of silently diverging).
[profile.test]
opt-level = 3
