[package]
name = "recog-copilot"
version = "0.1.0"
edition = "2024"
description = "The Copilot processes of recog: the supervisor that runs the Claude session per meeting, and the MCP channel"
publish = false

[[bin]]
name = "recog-copilot-supervisor"
path = "src/bin/recog-copilot-supervisor.rs"

[[bin]]
name = "recog-copilot-channel"
path = "src/bin/recog-copilot-channel.rs"

[dependencies]
bytes = "1"
# The SSE ping comments carry the UTC time as Python's datetime prints it.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
# The channel's HTTP transport: HTTP/1.1, as uvicorn serves the Python channel.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
recog-core = { path = "../recog-core" }
# The official MCP SDK: the protocol model, the handshake and the request dispatch of the
# channel.
rmcp = { version = "3.9", default-features = false, features = ["server"] }
# Insertion order keeps the frames' keys in the order the Python dicts have.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.49", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
toml = "0.9"
# Unicode 15.0, the tables of Python 3.12's unicodedata: model names and saved prompt ids
# are validated by general category, as the Python settings store does.
unicode-general-category = "0.6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1", "server"] }
tempfile = "3"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
