[package]
name = "recog-copilot"
version = "0.1.0"
edition = "2024"
description = "The Copilot processes of recog: the supervisor that runs the Claude session per meeting"
publish = false

[[bin]]
name = "recog-copilot-supervisor"
path = "src/bin/recog-copilot-supervisor.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Insertion order keeps the frames' keys in the order the Python dicts have.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.49", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.29"
toml = "0.9"
# Unicode 15.0, the tables of Python 3.12's unicodedata: model names and saved prompt ids
# are validated by general category, as the Python settings store does.
unicode-general-category = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.49", features = ["macros", "net", "rt", "sync", "test-util", "time"] }
