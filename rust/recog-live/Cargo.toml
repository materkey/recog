[package]
name = "recog-live"
version = "0.1.0"
edition = "2024"
description = "The live process of recog: capture, echo cancellation, ASR, per-speaker ingest, refine, golden recording"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# SIGTERM to a capture child before the kill, as Popen.terminate().
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# The model lock is reentrant, as Python's threading.RLock: the refine worker holds
# it around a callback that may take it again inside the ASR.
parking_lot = "0.12.5"
recog-core = { path = "../recog-core" }
speexdsp-aec = { path = "../speexdsp-aec" }
# The real FFTs of the suppressor, the echo path detector and the inverse filter.
realfft = "3.5.1"
# audio_key of the golden recorder: hashlib.sha1, the key the Python player looks answers up by.
sha1 = "0.10.6"
# Pinned exactly, as in wavo-asr-py: the measurements of
# docs/experiments/2026-11-07-rust-asr-runtimes.md hold for this version.
wavo = { version = "=0.4.0", default-features = false, features = ["hub"] }

[dev-dependencies]
base64 = "0.22.1"
# float_roundtrip: Python's answers are compared as exact f64s, and the default parser
# can be one ulp off.
serde_json = { version = "1.0.141", features = ["float_roundtrip"] }
# The differential tests compare PCM both sides generated by its SHA-256.
sha2 = "0.10.9"
tempfile = "3.20"
