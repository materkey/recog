[package]
name = "asrbench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wavo = { version = "=0.4.0", default-features = false, features = ["hub"], optional = true }
gigastt-core = { version = "=2.22.0", default-features = false, optional = true }

[features]
wavo = ["dep:wavo"]
gigastt = ["dep:gigastt-core"]
cuda = ["gigastt", "gigastt-core/cuda"]
coreml = ["gigastt", "gigastt-core/coreml"]

[profile.release]
debug = false
