name: Release archives

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to build a macOS disk image for
        type: string
        required: true

permissions:
  contents: read

jobs:
  archive:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: macos-latest
            trusted: '["self-hosted","macos","recog"]'
            asset: macos-arm64
          - runner: ubuntu-24.04
            trusted: '["self-hosted","linux","recog"]'
            asset: linux-x86_64
    runs-on: ${{ github.event.repository.private && fromJSON(matrix.trusted) || matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public archive
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py archive "$TAG" dist
      - name: Build Linux distribution packages
        if: matrix.asset == 'linux-x86_64'
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build_linux_packages.sh "$TAG" dist
      - uses: actions/upload-artifact@v4
        with:
          name: recog-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/linux-packages.sha256
          if-no-files-found: error

  disk-image:
    needs: archive
    if: ${{ !cancelled() && (needs.archive.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          name: recog-macos-arm64
          path: dist
      - name: Download the verified archive of the existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          name="recog-$TAG-macos-arm64.tar.gz"
          gh release download "$TAG" --pattern "$name" --pattern SHA256SUMS --dir dist
          cd dist
          awk -v name="$name" '$2 == name || $2 == "./"name {print $1"  "name; n++} END {if (n != 1) exit 1}' SHA256SUMS > expected
          shasum -a 256 -c expected
      - name: Build and verify the Finder disk image
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          RECOG_DMG_TEST_SERVICES: '1'
        run: |
          scripts/build_dmg_ffmpeg.sh "$RUNNER_TEMP/recog-ffmpeg"
          scripts/fetch_sparkle.sh "$RUNNER_TEMP/recog-sparkle"
          python3 scripts/build_macos_dmg.py "$TAG" dist "$RUNNER_TEMP/recog-ffmpeg" --sparkle-sdk "$RUNNER_TEMP/recog-sparkle"
      - uses: actions/upload-artifact@v4
        with:
          name: recog-macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  draft:
    if: github.event_name == 'push'
    needs: [archive, disk-image]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macos","recog"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: recog-*
          path: dist
          merge-multiple: true
      - name: Prepare release with platform archives and formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py formula "$TAG" dist > dist/recog.rb
          (cd dist && shasum -a 256 ./*.tar.gz ./*.dmg > SHA256SUMS)
          PATH="/opt/homebrew/bin:$PATH" gh release create "$TAG" --verify-tag --draft --generate-notes dist/*
