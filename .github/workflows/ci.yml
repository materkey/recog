# Runs scripts/check.sh on both supported hosts in a clean environment.
#
# The dependency set mirrors setup.sh (torch from the CPU index, GigaAM from
# the pinned git ref, deploy/python/requirements.txt + deploy/python/requirements-web.txt, plus
# deploy/python/requirements-macos.txt on darwin) so a run here fails for the same reasons a
# fresh install would. On macOS every pip stage carries
# `-c deploy/python/constraints/macos.txt`: CI must not resolve the ML stack to versions the
# Mac's MPS/PyObjC contracts were never verified against.
#
# No service is installed, no audio is captured and no model weights are
# downloaded — that part of the verification needs real hardware.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Same pin setup.sh installs; the PyPI release lags the decoder and
      # word-timestamp API recog/asr.py and recog/refine.py call directly.
      GIGAAM_URL: https://github.com/salute-developers/GigaAM.git
      GIGAAM_REF: 6e4b027
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pip constraints
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "PIP_ARGS=-c deploy/python/constraints/macos.txt" >> "$GITHUB_ENV"
          else
            echo "PIP_ARGS=" >> "$GITHUB_ENV"
          fi

      # The Linux sounddevice wheel does not bundle PortAudio; scripts/deps.sh
      # requires it (`import sounddevice` probe) and setup.sh refuses to start
      # the services without it, so CI installs the same package.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install torch (CPU wheels)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install $PIP_ARGS --index-url https://download.pytorch.org/whl/cpu \
            torch torchaudio

      - name: Install GigaAM (pinned git ref)
        shell: bash
        run: pip install $PIP_ARGS "gigaam @ git+${GIGAAM_URL}@${GIGAAM_REF}"

      - name: Install requirements
        shell: bash
        run: |
          reqs=(-r deploy/python/requirements.txt -r deploy/python/requirements-web.txt)
          if [ "$RUNNER_OS" = "macOS" ]; then
            reqs+=(-r deploy/python/requirements-macos.txt)
          fi
          pip install $PIP_ARGS "${reqs[@]}"

      - name: Install quality tools
        shell: bash
        run: pip install $PIP_ARGS -r deploy/python/requirements-quality.txt

      - name: Select quality baseline
        if: runner.os == 'Linux'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        shell: bash
        run: |
          base="${PR_BASE:-origin/main}"
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$PUSH_BEFORE" ] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
            if [ "$PUSH_FORCED" = true ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
              echo "::warning::Pre-push commit is absent after a force-push; comparing against $base"
            fi
          fi
          echo "RECOG_QUALITY_BASE=$base" >> "$GITHUB_ENV"

      - name: Run checks
        shell: bash
        run: ./scripts/check.sh

      - name: Summarize quality delta
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for report in .local/quality/run-*/report.md; do
            [ -f "$report" ] || continue
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish quality reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            .local/quality/run-*/*.json
            .local/quality/run-*/*.md
            .local/quality/run-*/*.log
          include-hidden-files: true
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
        working-directory: browser-extension
      - run: npm test -- --runInBand
        working-directory: browser-extension
      - run: npm run build
        working-directory: browser-extension
