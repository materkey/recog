# Runs scripts/check.sh on both supported hosts, on self-hosted runners
# (docs/ci-runners.md): the repository is private, and hosted runners spend the
# account's Actions minutes.
#
# recog itself is Rust (check.sh builds and tests the workspace); Python is only
# the quality tools and the shell scripts' tests.
#
# No service is installed, no audio is captured and no model weights are
# downloaded — that part of the verification needs real hardware.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, linux, recog]
          - os: macos
            runner: [self-hosted, macos, recog]
    runs-on: ${{ matrix.runner }}
    env:
      # Debug information is most of a test build's size: with it, the tests'
      # build and the coverage-instrumented one of the quality gate ran out of
      # disk on ubuntu-latest (ld: Bus error). Neither needs it.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"

      # setup-python's macOS builds only install under /Users/runner/hostedtoolcache,
      # which exists on hosted runners alone: the Mac runner's Python 3.12 is
      # Homebrew's, in a venv of this job (pip refuses Homebrew's own environment).
      - name: Python 3.12 on the Mac runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /opt/homebrew/bin/python3.12 -m venv "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"

      # The Rust workspace: check.sh formats, lints and tests it; the quality gate
      # measures its coverage with cargo llvm-cov, which needs llvm-tools.
      - name: Install Rust components
        shell: bash
        run: rustup component add clippy rustfmt llvm-tools-preview

      # The quality gate runs on Linux only (see "Select quality baseline").
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The quality tools and pytest, and PyYAML for the workflow's own tests.
      - name: Install quality tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/python/requirements-quality.txt pyyaml

      # ESLint, c8 and the extension's jest for the JavaScript part of the
      # quality gate (docs/quality.md).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            deploy/node/package-lock.json
            browser-extension/package-lock.json

      - name: Install JavaScript quality tools
        run: |
          npm ci --prefix deploy/node
          npm ci --prefix browser-extension

      # gitleaks has no pip distribution: the pinned release, checked against
      # the sha256 published in its checksums file.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
            sha256=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          else
            asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          fi
          curl -fsSLo "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$sha256  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # The quality gate (two coverage runs of every test) runs on Linux only: it
      # took the macOS job from about 10 to 30 minutes and a second, instrumented
      # build of the workspace, and the macOS runner is a laptop with little disk.
      # The macOS job still builds, lints and tests everything, including the
      # macOS-only code, through check.sh without RECOG_QUALITY_BASE.
      - name: Select quality baseline
        if: runner.os == 'Linux'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        shell: bash
        run: |
          base="${PR_BASE:-origin/main}"
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$PUSH_BEFORE" ] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
            if [ "$PUSH_FORCED" = true ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
              echo "::warning::Pre-push commit is absent after a force-push; comparing against $base"
            fi
          fi
          echo "RECOG_QUALITY_BASE=$base" >> "$GITHUB_ENV"

      - name: Run checks
        shell: bash
        run: ./scripts/check.sh

      - name: Summarize quality delta
        if: always()
        shell: bash
        run: |
          for report in .local/quality/run-*/report.md; do
            [ -f "$report" ] || continue
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish quality reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ runner.os }}
          path: |
            .local/quality/run-*/*.json
            .local/quality/run-*/*.md
            .local/quality/run-*/*.log
          include-hidden-files: true
          if-no-files-found: error

  extension:
    runs-on: [self-hosted, linux, recog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
        working-directory: browser-extension
      - run: npm test -- --runInBand
        working-directory: browser-extension
      - run: npm run build
        working-directory: browser-extension
