[package]
name = "recog-live"
version = "0.1.0"
edition = "2024"
description = "The live process of recog: capture, echo cancellation, ASR, per-speaker ingest, refine, golden recording"
publish = false

[lib]
path = "src/lib.rs"

# The live process (`python -m recog live` in Rust), `meetings` and the golden replay.
[[bin]]
name = "recog"
path = "src/main.rs"

[dependencies]
tempfile = "3.20"
recog-install = { path = "../recog-install" }
# The replay's WebSocket clients split into a sender and a reader of the broadcasts.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
recog-ai = { path = "../recog-ai" }
# The bridge runs in this process, on its own runtime thread.
recog-bridge = { path = "../recog-bridge" }
recog-zoom = { path = "../recog-zoom" }
# Ctrl+C, the replay's clients and the title calls run on small runtimes of their own.
tokio = { version = "1.49", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
# str.isalnum() of the dedup: Unicode 15.0, Python 3.12's database.
unicode-general-category = "0.6"
# SIGTERM to a capture child before the kill, as Popen.terminate().
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# The model lock is reentrant, as Python's threading.RLock: the refine worker holds
# it around a callback that may take it again inside the ASR.
parking_lot = "0.12.5"
recog-core = { path = "../recog-core" }
speexdsp-aec = { path = "../speexdsp-aec" }
# The real FFTs of the suppressor, the echo path detector and the inverse filter.
realfft = "3.5.1"
# audio_key of the golden recorder: hashlib.sha1, the key the Python player looks answers up by.
sha1 = "0.10.6"
sha2 = "0.10.9"
# The remote ASR gateway: the client wavo's hub already brings, without default features.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# wavo PR #120 adds the GigaAM v4 encoder.
wavo = { git = "https://github.com/vladkens/wavo", rev = "fb472d33f721b52c67eb3811739e7a90fbd94cd6", default-features = false, features = ["hub"] }

# The device list of `--list-devices` and `--mic-device`: CoreAudio, nothing opened.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"

[dev-dependencies]
base64 = "0.22.1"
# float_roundtrip: Python's answers are compared as exact f64s, and the default parser
# can be one ulp off.
serde_json = { version = "1.0.141", features = ["float_roundtrip"] }
# The differential tests compare PCM both sides generated by its SHA-256.
